[LIMITS]
// Only AnimWadBlocks is needed. The rest are off on purpose: the stock table
// sizes already have room for everything TACE uses, so raising them buys
// nothing and only adds risk. The notes beside each one record why it was left
// alone rather than a job someone still has to finish - none of them need
// calibrating unless a future TACE build actually runs out of a slot.
AnimWadBlocks = 4096                          // .wad animation store size, REQUIRED by TACE for full DLC animations | 1500: stock, values below it are clamped
Handling = 0                                  // handling.cfg tables | not needed - stock capacity is enough. Left uncalibrated: finds 25 of 26 xrefs on 1.0.8.0, the one at array offset 0x5F60 does not resolve
HandlingScale = 2                             // multiplier for the handling line counts (160/40/40/40 stock), minimum 2. Only read when Handling = 1, so it does nothing as shipped
Carcols = 0                                   // carcols colour tables | not needed - stock capacity is enough. Left uncalibrated: the operand offset is wrong for the variant that matches this build
VehicleOffsets = 0                            // vehicle offset table | not needed - stock capacity is enough. Left uncalibrated: the signature matches an unrelated instruction
WeaponInfo = 0                                // weapon table 60 -> 120 entries | not needed - 60 slots is enough for TACE. Resolves cleanly on this build (16/16 xrefs) if it is ever wanted, but it is untested in game

[DEBUG]
// Everything diagnostic lives here. The three features below used to have their
// own "Debug = 1" key; those still work if you have them in an old ini, but
// Trace is the single switch now.

// Live console. TacePatch.log tells you what happened after the fact; the
// console shows it happening, which is the only way to watch a hook fire while
// you play. Put it on a second monitor and run the game borderless - exclusive
// fullscreen will keep stealing focus back.
// The window has no close button on purpose: closing a console kills the
// process that owns it, and that process is GTAIV.exe. QuickEdit is turned off
// for the same reason - clicking in a QuickEdit console blocks the next write
// and freezes whichever game thread logs next.
Console = 0                                   // 1 = open a console window alongside the game
ConsolePos =                                  // "x,y" in desktop pixels, e.g. 2560,0 for the monitor to the right. Blank = wherever Windows puts it
ConsoleColumns = 132                          // window width in characters
ConsoleRows = 44                              // window height in lines
ConsoleScrollback = 9000                      // lines kept for scrolling back
ConsoleColours = 1                            // colour by subsystem and severity
ConsoleTitle = TacePatch                      // window title; replaced with a live applied/skipped/failed tally once startup finishes

// WHICH subsystems emit their per-event lines, comma separated. The names are
// the same tags the console prints, so what you read in the window is what you
// type here. "all" turns on everything; blank is quiet.
//   patch      every one of the ~120 signature patches, and where it landed
//   limits     per-offset cross-reference counts for each array being moved
//   painvoice  every pain sound, with the slot state that produced it
//   gangs      every gang weapon roll, plus a dump of the live table
//   cops       every rooftop sniper and helicopter crewman as it is armed
// Anything that DIDN'T land is reported regardless of this setting - you never
// have to opt in to hearing about a failure.
Trace =                                       // e.g. Trace = gangs, cops

// HOW MUCH of what is produced reaches the console and the log.
Level = trace                                 // trace | info | warn | error - error shows only what broke
Timestamps = 1                                // prefix every line with seconds since the .asi loaded
LogFile = 1                                   // 0 = console only, no TacePatch.log
AppendLog = 0                                 // 0 = start a fresh log each run, 1 = keep every run in one file
UnlimitedTrace = 0                            // the per-event traces stop after ~120-200 events so the log cannot balloon. 1 lifts that - only sensible with Console = 1, which scrolls instead of growing
VerboseXrefs = 1                              // the limit adjuster's cross-reference report; also implied by Trace = limits
// Episode gate profiler. Instruments all 462 places the game branches on which
// episode is loaded, then reports each one the first time it is reached:
// whether it took the episodic path, or was LOCKED OUT because the episode is
// not the one it wants. Static analysis says what a gate does mechanically;
// this says which gates an ACTION touches, which is the only way to find the
// ones nobody has named. See docs/episode-gates.txt.
// It only watches - the game's own jump still decides the path, so nothing
// about behaviour changes. Every site is byte-verified before it is touched,
// and any that does not match is skipped.
GateProfile = 0                               // 1 = instrument the episode gates (needs Console = 1 to be much use)
GateProfileKey = 121                          // virtual-key code for the mark key, 121 = F10. Press it, perform an action, and only the gates that action touched are reported

// ---------------------------------------------------------------------------
// Crash logger
//
// When the game dies, TacePatch writes a text log and a .dmp into a
// "TacePatch Crashes" folder next to the .asi. The log opens with a verdict:
// whether any pointer into TacePatch.asi appears anywhere in the faulting
// stack. If none does, the crash is not ours and the file says so in the first
// ten lines - which is the answer that otherwise costs an afternoon in a
// debugger. After that come the exception, a reconstructed call stack, the
// mod's own patch tally, the registers, an annotated stack dump and the full
// module list with load addresses.
//
// It does NOT take crash reporting away from ZolikaPatch or anything else.
// TacePatch arranges to run first (a handler that terminates the process
// leaves nothing for anyone after it), writes its log, then calls the handlers
// it displaced - so their dumps keep appearing exactly as before.
CrashLogger = 1                               // 0 = install no handler at all
CrashMiniDump = 1                             // also write a .dmp next to the .log, for loading in a debugger
CrashFullDump = 0                             // 1 = MiniDumpWithFullMemory. Hundreds of MB per crash; only when someone asks for it
CrashChain = 1                                // 0 = do not call the handlers we displaced. Leave at 1 unless ZolikaPatch's dumps are getting in the way
CrashVectored = 1                             // ALSO watch through a vectored handler. Needed here: something in this install keeps the top-level filter cleared, and without this a crash produces a ZolikaPatch dump and no log of ours
CrashVectoredMiniDump = 0                     // 1 = write a .dmp for first-chance reports too. Tens of MB each, for exceptions the game may be about to handle
CrashMaxLogs = 8                              // reports per run, so a game that swallows exceptions in a loop cannot fill the disk
CrashTrackFiles = 1                           // record the last file and library the game opened, by swapping IAT entries. The single most useful line for a streaming crash
CrashStackWords = 128                         // dwords of annotated stack printed. 16-4096
CrashScanWords = 4096                         // dwords of stack scanned for return addresses and module pointers. 256-65536
CrashDir =                                    // override the output folder. Blank = "TacePatch Crashes" beside the .asi
CrashTest = 0                                 // set to 1337 to crash on purpose at startup and verify the logger. Nothing else triggers it

[PAINVOICE]
Enabled = 1                                   // give characters with their own recorded pain speech their real voice as NPCs, instead of PAIN_MALE / PAIN_FEMALE
Voice1 = JOHNNY, 15, IG_JOHNNYBIKER           // <bank root>, <number of "<root>_NN" banks>, <ped model>[, <ped model>...]
Voice2 = LUIS, 15, IG_LUIS
Voice3 = NIKO, 15, IG_NIKO
// Voice3 and Voice4 are read the same way. Each voice takes one extra pain
// slot, and every slot needs two wave slots of its own added to
// pc/audio/config/waveslots.xml - see assets/waveslots-painvoice.xml. Voice1
// uses PAIN_EXTRA_0_0 / PAIN_EXTRA_0_1, Voice2 PAIN_EXTRA_1_0 / PAIN_EXTRA_1_1,
// and so on. A voice whose wave slots or speech banks are missing (JOHNNY_xx
// only ships in TLAD's audio, LUIS_xx only in TBoGT's) is skipped at runtime
// and those peds keep the generic voice - see TacePatch.log.

[GANGWEAPONS]
Enabled = 1                                   // let gangs carry different weapons, including the DLC ones

// <weapon>,<chance> three times, best-to-worst. Weapon by name or numeric id.
// CHANCES ARE OUT OF 255, NOT 100 - the game rolls 0..255 and walks the three
// slots cumulatively, so vanilla's 20/40/20 = 80 leaves about two thirds of gang
// peds unarmed. Raise these if you want them actually carrying.
// DLC weapon names: SAWNOFF_SHOTGUN, AUTOMATIC_PISTOL, ASSAULT_SHOTGUN, AA12,
// P90, GOLDEN_UZI, M249, ADVANCED_SNIPER, PISTOL_44, GRENADE_LAUNCHER, PIPE_BOMB,
// STICKY_BOMB, BROKEN_POOL_CUE.

// The two biker gangs. GANG_BIKER_1 is the Angels of Death, who only spawn in
// BEECHWOOD_BIKERS and BOAB; GANG_BIKER_2 is The Lost, who only spawn in ACTER.
// Two zones out of seventy, so go to them to see the change - elsewhere the
// bikers you meet belong to neither group.
GANG_BIKER_1 = AUTOMATIC_PISTOL,60, SAWNOFF_SHOTGUN,60, KNIFE,20

GANG_BIKER_2 = AUTOMATIC_PISTOL,60, SAWNOFF_SHOTGUN,60, KNIFE,20


// Any of these can be set the same way. Left commented out, they keep the stock
// loadout for that gang.
// GANG_ALBANIAN = KNIFE,20, PISTOL,40, MICRO_UZI,20
// GANG_ITALIAN = PISTOL,40, MP5,40, BARETTA,20
// GANG_RUSSIAN = KNIFE,20, PISTOL,40, MICRO_UZI,20
// GANG_RUSSIAN_2 = SHOTGUN,40, PISTOL,40, AK47,20
// GANG_IRISH = BASEBALLBAT,20, PISTOL,40, SHOTGUN,20
// GANG_JAMAICAN = PISTOL,34, MICRO_UZI,33, SHOTGUN,33
// GANG_AFRICAN_AMERICAN = BASEBALLBAT,15, PISTOL,40, MICRO_UZI,35
// GANG_KOREAN = KNIFE,20, PISTOL,40, SHOTGUN,20
// GANG_CHINESE_JAPANESE = KNIFE,20, PISTOL,40, MICRO_UZI,20
// GANG_PUERTO_RICAN = KNIFE,20, PISTOL,40, MICRO_UZI,30

[COPWEAPONS]
Enabled = 1                                   // let police and SWAT carry different weapons
// Cops are armed directly by the ped setup function, not by the gang table, so
// none of the gang caveats apply here - these are plain code immediates read on
// every spawn, with no savegame involvement.
// Values below are the stock ones, so nothing changes until you edit them.
Cop = PISTOL                                  // ordinary police, always
CopAccuracy = 30                              // 0-100
SwatSidearm = PISTOL                          // SWAT and FBI, always
SwatSecondary = MP5                           // SWAT and FBI, on the chance below
SwatSecondaryChance = 50                      // percent
// TacePatch's own PoliceEpisodicWeaponSupport patch makes the TBoGT branch run
// in EVERY episode, so SwatPrimaryTBoGT is the one that takes effect and
// SwatPrimary below is dead code unless that patch is removed. Set both to
// matching weapons if you want it to hold either way.
SwatPrimaryTBoGT = M4, AA12, P90              // three-way split; THIS is the live one
SwatPrimary = M4, SHOTGUN                     // base IV / TLAD two-way split, only if PoliceEpisodicWeaponSupport is off
SwatAccuracy = 40                             // 0-100
// These two take a LIST: one weapon is picked at random per ped. The matching
// ...Extra key adds weapons every one of them carries as well.
RooftopSniper = SNIPERRIFLE, ADVANCED_SNIPER  // wanted-level rooftop snipers; ADVANCED_SNIPER is the DSR-1
RooftopSniperExtra =                          // e.g. PISTOL for a sidearm
HeliCop = M249                                // helicopter crews, all three passengers; a list randomises per crewman
HeliCopExtra =                                // carried in addition to the above, e.g. PISTOL. Blank = nothing extra.

[COVERANIM]
// Per-weapon cover blind-fire animations.
//
// Every shotgun in WeaponInfo.xml is group="SHOTGUN", and the engine picks the
// cover blind-fire animation by GROUP - so all six play SHOTGUN_BLINDFIRE,
// which pumps. Right for the pump-action, nonsense for the sawn-off or the
// AA-12, which have nothing to pump.
//
// Name a weapon here and it blind-fires with the animation you give instead.
// Anything not listed keeps vanilla, so the pump-action still pumps.
//
// CHOOSING ONE. Each animation carries its own fire events, and those - not the
// weapon's clip size - decide how many shots a blind-fire burst lets off. That
// matters most on small clips. Tested in game:
//
//   ROCKET_BLINDFIRE    ONE shot, does not loop, and reloads properly - the
//                       only correct BEHAVIOUR found so far for a two-round
//                       weapon. The pose is a launcher though, so it reads
//                       wrong on a sawn-off.
//   Pistol_BlindFire    three fire events - a two-round weapon fires a third
//                       time on an empty chamber.
//   AK47_BLINDFIRE      loops. Keeps firing visually at 0 ammo and never
//                       reaches the reload.
//   Rifle_BlindFire     loops, same problem.
//   UZI_BLINDFIRE       untested; an SMG animation, so expect it to loop.
//   SHOTGUN_BLINDFIRE   vanilla - the one that pumps.
//
// So: low-capacity weapons want ROCKET_BLINDFIRE. Higher-capacity shotguns
// (Baretta, AA-12, assault) have not been tuned yet - a looping animation may
// suit them, at the cost of firing visually when empty.
//
// There is NO animation called RIFLE_BLINDFIRE in the executable.
// Set [DEBUG] Trace = cover to list the whole set at startup and watch each
// swap as you change weapons.
//
// Weapon names are the same ones [GANGWEAPONS] and [COPWEAPONS] accept, so
// SAWNOFF_SHOTGUN and EPISODIC_6 are the same weapon. The shotguns are:
//   SHOTGUN  BARETTA  ASSAULT_SHOTGUN  SAWNOFF_SHOTGUN  AA12  EPISODIC_22
//
// One caveat: the animation tables are global, so this follows the PLAYER's
// weapon. An NPC blind-firing a shotgun from cover at that moment shares it.
// A looping animation has nothing left to fire once the clip is empty, but
// carries on anyway - AK47_BLINDFIRE spends about five seconds on an empty
// chamber before the game reaches the reload, against 1.4s for a non-looping
// one. CutWhenEmpty ends the playing animation the moment the clip reads 0, so
// the loop stops and the reload starts. That makes a looping animation with
// good recoil usable on a small clip.
CutWhenEmpty = 1                              // 0 = let the animation run its course
CutDelay = 250                                // ms to wait after the clip empties before cutting. 0 cuts instantly, which reads as snatching the last shot away
CutAt = 90                                    // how far to wind the animation, as a percent. 100 ends it dead; 90 leaves a tail so it settles

Enabled = 0                                   // 1 = apply the overrides below

SAWNOFF_SHOTGUN = AK47_BLINDFIRE              // best recoil of the set; CutWhenEmpty stops it looping on an empty chamber
ASSAULT_SHOTGUN = AK47_BLINDFIRE
AA12 = AK47_BLINDFIRE
