// TacePatch settings. Anything after // is a comment.
// Weapons are named or numbered: PISTOL DEAGLE SHOTGUN BARETTA MICRO_UZI MP5 AK47 M4 SNIPERRIFLE M40A1
// RLAUNCHER MINIGUN GRENADE_LAUNCHER ASSAULT_SHOTGUN SAWNOFF_SHOTGUN AUTOMATIC_PISTOL PISTOL_44 AA12 P90
// GOLDEN_UZI M249 ADVANCED_SNIPER PIPE_BOMB STICKY_BOMB KNIFE BASEBALLBAT ... (full list: src\Weapons.h)

[LIMITS]
AnimWadBlocks = 4096        // .wad animation slots. Full DLC animations need this (stock 1500)
CarGenerators = 4096        // parked car generators, map and script together (stock 1100)
ScriptCarGenerators = 128   // of those, the ones scripts can create. Past 25 they save to TacePatch\Saves (stock 25)
Handling = 0                // 1 = raise the handling.dat line limits by HandlingScale
HandlingScale = 2           // times larger. Stock: 160 cars, 40 bikes, 40 aircraft, 40 boats
Carcols = 0                 // 1 = car colours 196 -> 392
VehicleOffsets = 0          // 1 = vehicle offsets 205 -> 410
WeaponInfo = 0              // 1 = weapon info slots 60 -> 120

[BLIPSPRITES]
// Extra radar sprites: <id> = <texture in blips.wtd>, counting up from 129 with no gaps.
129 = radar_grocers         // in every blips.wtd, never given an id by the game
130 = radar_hostage
131 = radar_light

[PHONE]
RunWithPhone = 1            // walk, run and sprint with the phone out (stock: walk only)
PhoneInCover = 1            // use the phone in cover, calls included (stock: cover puts it away)
CoverInCalls = 1            // take cover during a call (needs PhoneInCover)
PhoneIntoVehicle = 1        // keep the phone open while getting into a vehicle (stock: closes it)
VehiclesInCalls = 1         // get into a vehicle during a call (needs PhoneInCover)
PedsInCalls = 0             // NPCs keep moving through calls too (stock: they stop)
PhoneBlendGroup = 4         // blend group of the phone anims in a call. 4 keeps them above cover - do not change
GestureKnowsPhone = 1       // during a call, gestures leave the phone arm alone so the phone stays at the ear
GestureBlendGroup = 6       // blend group of speech gestures during a call. 4 = stock, and they evict the phone anim

[SILENCED]
// Guns with the SILENCED flag in WeaponInfo.xml (stock: a silenced shot panics every ped within 100 m).
Enabled = 1
HearRange = 3               // metres. Closer than this it is heard like any gunshot
SeeRange = 25               // metres. Further than this nobody notices it (stock 45)
SeeAngle = 120              // degrees of view it must be inside to be seen (stock 180)

[EXPLOSIVEROUNDS]
// Bullets that explode where they hit. Explosions: 0 grenade, 2 rocket, 4 car, 16 AA12 shell, 17 Annihilator, 18 APC, -1 none.
Enabled = 1
Weapons = 30:16, 40:18          // <weapon>:<explosion>[:P], fired by anyone. P = only when the player fires
Vehicles = annihilator:20:17:P  // <model>:<weapon>:<explosion>[:P], beats Weapons for that vehicle. P = player driving

[COPWEAPONS]
// Police loadouts. These are the stock ones; a list picks one at random per ped.
Enabled = 0
Cop = PISTOL                // ordinary police
CopAccuracy = 30            // 0-100
SwatSidearm = PISTOL        // SWAT and FBI, always
SwatSecondary = MP5         // SWAT and FBI, on the chance below
SwatSecondaryChance = 50    // percent
SwatPrimaryTBoGT = M4, AA12, P90 // SWAT and FBI main gun - TACE uses this split in every episode
SwatPrimary = M4, SHOTGUN   // the IV/TLAD split. Unused while PoliceEpisodicWeaponSupport is patched (always)
SwatAccuracy = 40           // 0-100
RooftopSniper = SNIPERRIFLE // rooftop snipers
RooftopSniperExtra =        // carried as well, e.g. PISTOL. Blank = nothing extra
HeliCop = M249              // helicopter crews, all three passengers
HeliCopExtra =              // carried as well
BoatCop = M4                // police boat passengers, 1-4 per boat (the driver carries Cop)
BoatCopExtra =              // carried as well

[GANGWEAPONS]
// <weapon>,<chance> three times, best to worst. Chances are out of 255, not 100. Commented out = stock.
// GANG_BIKER_1 is the Angels of Death, GANG_BIKER_2 is The Lost.
Enabled = 1
GANG_BIKER_1 = AUTOMATIC_PISTOL,60, SAWNOFF_SHOTGUN,60, KNIFE,20
GANG_BIKER_2 = AUTOMATIC_PISTOL,60, SAWNOFF_SHOTGUN,60, KNIFE,20
// GANG_ALBANIAN = KNIFE,20, PISTOL,40, MICRO_UZI,20
// GANG_ITALIAN = PISTOL,40, MP5,40, BARETTA,20
// GANG_RUSSIAN = KNIFE,20, PISTOL,40, MICRO_UZI,20
// GANG_RUSSIAN_2 = SHOTGUN,40, PISTOL,40, AK47,20
// GANG_IRISH = BASEBALLBAT,20, PISTOL,40, SHOTGUN,20
// GANG_JAMAICAN = PISTOL,34, MICRO_UZI,33, SHOTGUN,33
// GANG_AFRICAN_AMERICAN = BASEBALLBAT,15, PISTOL,40, MICRO_UZI,35
// GANG_KOREAN = KNIFE,20, PISTOL,40, SHOTGUN,20
// GANG_CHINESE_JAPANESE = KNIFE,20, PISTOL,40, MICRO_UZI,20
// GANG_PUERTO_RICAN = KNIFE,20, PISTOL,40, MICRO_UZI,30

[PAINVOICE]
// Story characters keep their own pain voice as NPCs. Needs the wave slots in assets\waveslots-painvoice.xml.
Enabled = 1
Voice1 = JOHNNY, 15, IG_JOHNNYBIKER // <bank root>, <bank count>, <ped model>[, <ped model>...]
Voice2 = LUIS, 15, IG_LUIS
Voice3 = NIKO, 15, IG_NIKO

[COVERANIM]
// Cover blind-fire animation per shotgun: <weapon> = <animation>. Follows the player's weapon.
// Animations: AK47_BLINDFIRE (loops), ROCKET_BLINDFIRE, RIFLE_BLINDFIRE, PISTOL_BLINDFIRE, UZI_BLINDFIRE.
Enabled = 0
CutWhenEmpty = 1            // end a looping blind-fire once the clip is empty
CutDelay = 250              // ms to wait first, so the last shot is not cut off
CutAt = 90                  // percent to wind to. 100 = the very end
SAWNOFF_SHOTGUN = AK47_BLINDFIRE
ASSAULT_SHOTGUN = AK47_BLINDFIRE
AA12 = AK47_BLINDFIRE

[DEBUG]
Console = 0                 // console window alongside the game. Run borderless, not fullscreen
ConsolePos =                // "x,y" desktop pixels. Blank = wherever Windows puts it
ConsoleColumns = 132        // width in characters
ConsoleRows = 44            // height in lines
ConsoleScrollback = 9000    // lines kept for scrolling back
ConsoleColours = 1          // colour by subsystem and severity
ConsoleTitle = TacePatch    // window title
Trace =                     // comma separated: patch limits painvoice gangs cops cover phone silenced explosive, or all
Level = info                // trace | info | warn | error
Timestamps = 1              // seconds since the .asi loaded
LogFile = 1                 // 0 = console only, no TacePatch.log
AppendLog = 0               // 1 = keep every run in one file
UnlimitedTrace = 0          // 1 = lift the per-event trace cap. Use with Console = 1
VerboseXrefs = 0            // 1 = limit adjuster cross-reference report
GateProfile = 0             // instrument the 462 episode gates. See docs\episode-gates.txt
GateProfileKey = 121        // mark key, 121 = F10

// Crash logger: a log and .dmp per crash in TacePatch\Crashes, opening with whether TacePatch caused it.
CrashLogger = 1             // 0 = install no handler
CrashMiniDump = 1           // .dmp beside the .log
CrashFullDump = 0           // full memory - hundreds of MB per crash
CrashChain = 1              // 0 = do not call the crash handlers of other mods afterwards
CrashVectored = 1           // needed here - something keeps clearing the top-level filter
CrashVectoredMiniDump = 0   // .dmp for first-chance reports too - tens of MB each
CrashMaxLogs = 8            // reports per run
CrashTrackFiles = 1         // record the last file opened. Best single line for a streaming crash
CrashStackWords = 128       // 16-4096
CrashScanWords = 4096       // 256-65536
CrashDir =                  // blank = TacePatch\Crashes beside the .asi
CrashTest = 0               // 1337 = crash on purpose, to test the logger
