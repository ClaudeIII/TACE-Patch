// TacePatch - configuration. Anything after // is a comment.

[LIMITS]
AnimWadBlocks = 4096        // .wad animation slots. Required for full DLC animations (stock 1500)
Handling = 0                // stock capacity is enough
HandlingScale = 2           // only read when Handling = 1
Carcols = 0                 // stock capacity is enough
VehicleOffsets = 0          // stock capacity is enough
WeaponInfo = 0              // 60 weapon slots is enough for TACE

[DEBUG]
Console = 0                 // console window alongside the game. Run borderless, not fullscreen
ConsolePos =                // "x,y" desktop pixels. Blank = wherever Windows puts it
ConsoleColumns = 132        // width in characters
ConsoleRows = 44            // height in lines
ConsoleScrollback = 9000    // lines kept for scrolling back
ConsoleColours = 1          // colour by subsystem and severity
ConsoleTitle = TacePatch    // window title

Trace =                     // comma separated: patch limits painvoice gangs cops cover copanims, or all
Level = trace               // trace | info | warn | error
Timestamps = 1              // seconds since the .asi loaded
LogFile = 1                 // 0 = console only, no TacePatch.log
AppendLog = 0               // 1 = keep every run in one file
UnlimitedTrace = 0          // 1 = lift the per-event trace cap. Use with Console = 1
VerboseXrefs = 1            // limit adjuster cross-reference report
GateProfile = 0             // instrument the 462 episode gates. See docs/episode-gates.txt
GateProfileKey = 121        // mark key, 121 = F10

// Crash logger. Writes a log and .dmp to "TacePatch Crashes" beside the .asi,
// opening with a verdict on whether the crash was ours. Handlers we displace
// still run afterwards, so other mods' dumps keep appearing.
CrashLogger = 1             // 0 = install no handler
CrashMiniDump = 1           // .dmp beside the .log
CrashFullDump = 0           // full memory - hundreds of MB per crash
CrashChain = 1              // 0 = do not call the handlers we displaced
CrashVectored = 1           // needed here - something keeps clearing the top-level filter
CrashVectoredMiniDump = 0   // .dmp for first-chance reports too - tens of MB each
CrashMaxLogs = 8            // reports per run
CrashTrackFiles = 1         // record the last file opened. Best single line for a streaming crash
CrashStackWords = 128       // 16-4096
CrashScanWords = 4096       // 256-65536
CrashDir =                  // blank = beside the .asi
CrashTest = 0               // 1337 = crash on purpose, to test the logger

[PAINVOICE]
// Give characters with recorded pain speech their own voice as NPCs. Each voice
// needs two wave slots in pc/audio/config/waveslots.xml - see
// assets/waveslots-painvoice.xml. Voices whose banks are missing are skipped.
Enabled = 1
Voice1 = JOHNNY, 15, IG_JOHNNYBIKER // <bank root>, <bank count>, <ped model>[, <ped model>...]
Voice2 = LUIS, 15, IG_LUIS
Voice3 = NIKO, 15, IG_NIKO

[GANGWEAPONS]
// <weapon>,<chance> three times, best to worst. CHANCES ARE OUT OF 255, not 100.
// GANG_BIKER_1 is the Angels of Death (BEECHWOOD_BIKERS, BOAB), GANG_BIKER_2 is
// The Lost (ACTER). DLC names: SAWNOFF_SHOTGUN AUTOMATIC_PISTOL ASSAULT_SHOTGUN
// AA12 P90 GOLDEN_UZI M249 ADVANCED_SNIPER PISTOL_44 GRENADE_LAUNCHER PIPE_BOMB
// STICKY_BOMB BROKEN_POOL_CUE.
Enabled = 1
GANG_BIKER_1 = AUTOMATIC_PISTOL,60, SAWNOFF_SHOTGUN,60, KNIFE,20
GANG_BIKER_2 = AUTOMATIC_PISTOL,60, SAWNOFF_SHOTGUN,60, KNIFE,20

// Uncomment to change a gang. Commented out = stock loadout.
// GANG_ALBANIAN = KNIFE,20, PISTOL,40, MICRO_UZI,20
// GANG_ITALIAN = PISTOL,40, MP5,40, BARETTA,20
// GANG_RUSSIAN = KNIFE,20, PISTOL,40, MICRO_UZI,20
// GANG_RUSSIAN_2 = SHOTGUN,40, PISTOL,40, AK47,20
// GANG_IRISH = BASEBALLBAT,20, PISTOL,40, SHOTGUN,20
// GANG_JAMAICAN = PISTOL,34, MICRO_UZI,33, SHOTGUN,33
// GANG_AFRICAN_AMERICAN = BASEBALLBAT,15, PISTOL,40, MICRO_UZI,35
// GANG_KOREAN = KNIFE,20, PISTOL,40, SHOTGUN,20
// GANG_CHINESE_JAPANESE = KNIFE,20, PISTOL,40, MICRO_UZI,20
// GANG_PUERTO_RICAN = KNIFE,20, PISTOL,40, MICRO_UZI,30

[COPWEAPONS]
// The values below are the stock ones, so nothing changes until you edit them.
Enabled = 1
Cop = PISTOL                // ordinary police, always
CopAccuracy = 30            // 0-100
SwatSidearm = PISTOL        // SWAT and FBI, always
SwatSecondary = MP5         // SWAT and FBI, on the chance below
SwatSecondaryChance = 50    // percent
SwatPrimaryTBoGT = M4, AA12, P90 // the live one - PoliceEpisodicWeaponSupport runs it in every episode
SwatPrimary = M4, SHOTGUN   // dead code unless PoliceEpisodicWeaponSupport is off
SwatAccuracy = 40           // 0-100
RooftopSniper = SNIPERRIFLE, ADVANCED_SNIPER // a list picks one at random per ped
RooftopSniperExtra =        // carried as well by all of them, e.g. PISTOL
HeliCop = M249              // helicopter crews, all three passengers
HeliCopExtra =              // carried as well. Blank = nothing extra

[COVERANIM]
// Every shotgun blind-fires with SHOTGUN_BLINDFIRE, which pumps - wrong for the
// sawn-off and the AA-12. Name one here to give it a different animation.
// Shotguns: SHOTGUN BARETTA ASSAULT_SHOTGUN SAWNOFF_SHOTGUN AA12 EPISODIC_22.
// ROCKET_BLINDFIRE fires once and reloads cleanly; AK47_BLINDFIRE has the best
// recoil but loops, so it wants CutWhenEmpty. Follows the PLAYER's weapon.
Enabled = 0
CutWhenEmpty = 1            // end a looping blind-fire once the clip is empty
CutDelay = 250              // ms to wait first, so the last shot is not cut off
CutAt = 90                  // percent to wind to. 100 = the very end

SAWNOFF_SHOTGUN = AK47_BLINDFIRE
ASSAULT_SHOTGUN = AK47_BLINDFIRE
AA12 = AK47_BLINDFIRE

[COPANIMS]
// Carry guns the way cops do: keep your own walkstyle and layer the gun pose over
// it, instead of move_rifle replacing how you walk. Poses come from gun@cops -
// SWAT_RIFLE for 2HANDED weapons, PISTOL_PARTIAL_A/B for the rest - chosen by the
// engine's own rule, so a weapon needs only its 2HANDED flag in WeaponInfo.xml.
Enabled = 0                 // the real off switch - 0 installs no hooks at all
ToggleKey =                 // toggle in game. Letter, digit, F1-F24, INSERT, HOME, NUMPAD0-9, 0x76. Blank = none

KeepWalkstyle = 1           // keep your walkstyle instead of move_rifle / move_crouch_rifle
Partial = 1                 // play the gun pose. Both halves are needed for the effect
Rpg = 1                     // launchers too. Falls back to the vanilla move_rpg walk if
                            // the pose below cannot play
RpgPose = SWAT_RIFLE        // which animation launchers pose with. A name on its own comes
                            // from gun@cops; SET:NAME comes from any other animation set,
                            // e.g. move_rpg:Idle. An unknown name is reported at startup
                            // with the set's animations listed.

// When the pose is held. Read off the animations playing, so it needs no list
// of animation sets and follows custom walkstyles.
OnlyWhileMoving = 1         // only on a move_player / move_rifle moveset - idle, walk, run, sprint
StopWhenBusy = 1            // drop it while anything else animates the upper body. Off = jitter
IncludeCrouch = 1           // crouching and its transitions count as moving

OneHanded = 1               // 0 = two-handed weapons only
PistolPose = B              // one-handed pose standing or walking
PistolPoseJogging = A       // ... jogging
PistolPoseSprinting = A     // ... sprinting
                            // A | B | vanilla. A judders at a stand - a fault in the
                            // stock animation - so B is the default there.

StartDelay = 80             // ms the conditions must hold before the pose starts
RetryDelay = 250            // ms between one start and the next
Blend = 400                 // blend weight in hundredths. 400 = 4.0, what cops use
